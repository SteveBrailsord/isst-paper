name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
      - "fig*.pdf"
      - "fig*.png"
      - "figures/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version.tex from git metadata
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cs)
          COUNT=$(git rev-list --count HEAD)
          {
            echo "% Auto-generated by .github/workflows/build-pdf.yml — do not edit by hand."
            echo "\\newcommand{\\paperversion}{r${COUNT}-${SHA}}"
            echo "\\newcommand{\\paperdate}{${DATE}}"
          } > version.tex
          echo "--- version.tex ---"
          cat version.tex

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: isst_paper.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: false

      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isst_paper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit."
          else
            SHA_SHORT=$(git rev-parse --short HEAD)
            git commit -m "chore: rebuild PDF for ${SHA_SHORT} [skip ci]"
            git push
          fi
